---
# Swap
swap_enabled: true
swap_size: 4G
swap_swappiness: 10

# UFW
ufw_enabled: true
# TCP ports to allow inbound from anywhere. Override per-host to add ports.
ufw_allowed_tcp_ports:
  - "22"
  - "80"
  - "443"
# Rules scoped to specific source IPs: [{ port, from_ip, proto }]
ufw_allowed_from:  []

# Unattended-upgrades
unattended_upgrades_enabled: true

# Docker
docker_enabled: true

# Base apt packages installed on every host
base_apt_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - unattended-upgrades

# Docker container logs. The compose templates read these for their shared
# `x-logging` anchor (json-file, rotated). 50m x 5 caps each container at
# 250 MB of logs.
docker_log_max_size: 50m
docker_log_max_file: 5

# journald. Without a cap journald may use up to 10% of the filesystem
# (it held 4 GB on the appview in Nov 2026).
journald_system_max_use: 500M
journald_max_retention: 1month

# Disk alert. A systemd timer checks every mounted filesystem every
# `disk_alert_interval` and posts to a Discord webhook when one passes
# `disk_alert_threshold_percent`. Stays off until a webhook URL is set.
disk_alert_webhook_url: ""
disk_alert_threshold_percent: 85
disk_alert_interval: 15min
# Extra freshness checks: alert when the newest file matching `glob` is older
# than `max_age_hours`, or no file matches. Example:
#   - { name: "pg-backup", glob: "/mnt/backups/happyview_*.sql.gz", max_age_hours: 26 }
disk_alert_freshness_checks: []
