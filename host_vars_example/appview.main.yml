# host_vars/appview/main.yml

# --- HappyView ---
happyview_hostname: gamesgamesgamesgames.games
happyview_image: ghcr.io/gamesgamesgamesgamesgames/happyview
happyview_image_tag: "2.15.0" # Latest release tag; updated via repository_dispatch
happyview_data_dir: /opt/happyview

# --- Postgres ---
postgres_db: happyview
postgres_user: happyview
postgres_password: "{{ vault_postgres_password }}"

# --- HappyView runtime config ---
happyview_public_url: "https://{{ happyview_hostname }}"
happyview_session_secret: "{{ vault_session_secret }}"
happyview_token_encryption_key: "{{ vault_token_encryption_key }}"
happyview_relay_url: "https://bsky.network"
happyview_jetstream_url: "wss://jetstream1.us-east.bsky.network"
# HappyView before 2.17.0 writes a script.executed event, with the full
# response body, for every XRPC query. At Cartridge's traffic that reached
# 17 GB at 30 days' retention (Nov 2026). Keep this short until the instance
# runs 2.17.0 or later, which only logs those events with verbose logging on.
happyview_event_log_retention_days: 7
happyview_rust_log: "happyview=info,tower_http=info,sqlx=warn"

# --- Backup ---
pg_backup_dir: /opt/happyview/backups
pg_backup_retention_days: 7

# --- Disk alert (base role) ---
disk_alert_webhook_url: "{{ vault_disk_alert_webhook_url }}"
disk_alert_freshness_checks:
  - name: pg-backup
    glob: "{{ pg_backup_dir }}/happyview_*.sql.gz"
    max_age_hours: 26

# --- Docs site ---
docs_image: ghcr.io/gamesgamesgamesgamesgames/docs
docs_image_tag: "1.0.0"
docs_client_key: "" # hvc_… client key for the docs site's API client

# --- ClickHouse (colocated) ---
clickhouse_ingest_domain: "ch.kart.sh"
