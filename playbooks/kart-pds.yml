---
- name: Provision kart-pds (Tranquil PDS + Postgres + Caddy)
  hosts: kart-pds
  become: yes
  vars:
    # The kart-pds-blobs Hetzner volume (id 107524374).
    kart_pds_blobs_volume_uuid: caa5ea6d-1786-4b03-95f3-b112ecfa3475
  roles:
    - base
  tasks:
    - name: Ensure kart-pds data directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ kart_pds_data_dir }}"
        - "{{ kart_pds_data_dir }}/postgres"
        - "{{ kart_pds_data_dir }}/tranquil-data"
        - "{{ kart_pds_data_dir }}/caddy"
        - "{{ kart_pds_data_dir }}/caddy/data"
        - "{{ kart_pds_data_dir }}/caddy/config"

    # Blobs live on a Hetzner volume (kart-pds-blobs, 100 GB), not the 38 GB
    # root disk, since Nov 18, 2026. nofail keeps a missing volume from
    # blocking boot; kart-pds.service has RequiresMountsFor, so the PDS
    # won't start without it.
    - name: Mount the blob volume
      ansible.posix.mount:
        path: "{{ kart_pds_data_dir }}/tranquil-data"
        src: "UUID={{ kart_pds_blobs_volume_uuid }}"
        fstype: ext4
        opts: discard,nofail,defaults
        passno: "2"
        state: mounted

    - name: Create journald drop-in directory
      file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Cap journald disk use
      copy:
        content: |
          # Managed by Ansible (cartridge-infra, playbooks/kart-pds.yml).
          [Journal]
          SystemMaxUse={{ journald_system_max_use | default('300M') }}
          MaxRetentionSec={{ journald_max_retention | default('1month') }}
        dest: /etc/systemd/journald.conf.d/00-size.conf
        mode: "0644"
      register: journald_conf

    - name: Restart journald to apply the cap
      systemd:
        name: systemd-journald
        state: restarted
      when: journald_conf.changed

    # rsyslog's syslog reached 1.6G on Nov 18, 2026. Rotate it daily, or
    # sooner once it passes 200M, and keep four.
    - name: Cap rsyslog's files
      copy:
        content: |
          # Managed by Ansible (cartridge-infra, playbooks/kart-pds.yml).
          /var/log/syslog
          /var/log/mail.log
          /var/log/kern.log
          /var/log/auth.log
          /var/log/user.log
          /var/log/cron.log
          {
          	rotate 4
          	daily
          	maxsize 200M
          	missingok
          	notifempty
          	compress
          	delaycompress
          	sharedscripts
          	postrotate
          		/usr/lib/rsyslog/rsyslog-rotate
          	endscript
          }
        dest: /etc/logrotate.d/rsyslog
        mode: "0644"

    - name: Log in to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ kart_pds_ghcr_username }}"
        password: "{{ kart_pds_ghcr_password }}"
      when: kart_pds_ghcr_password is defined and kart_pds_ghcr_password | length > 0
      no_log: true

    - name: Deploy docker-compose.yml
      template:
        src: ../templates/kart-pds/docker-compose.yml.j2
        dest: "{{ kart_pds_data_dir }}/docker-compose.yml"
        mode: "0644"
      notify: restart kart-pds

    - name: Deploy Caddyfile
      template:
        src: ../templates/kart-pds/Caddyfile.j2
        dest: "{{ kart_pds_data_dir }}/Caddyfile"
        mode: "0644"
      notify: restart kart-pds

    - name: Deploy Tranquil PDS config.toml
      template:
        src: ../templates/kart-pds/config.toml.j2
        dest: "{{ kart_pds_data_dir }}/config.toml"
        mode: "0644"
      notify: restart kart-pds

    - name: Deploy tranquil-pds.env
      template:
        src: ../templates/kart-pds/tranquil-pds.env.j2
        dest: "{{ kart_pds_data_dir }}/tranquil-pds.env"
        mode: "0600"
      notify: restart kart-pds

    - name: Deploy postgres.env
      template:
        src: ../templates/kart-pds/postgres.env.j2
        dest: "{{ kart_pds_data_dir }}/postgres.env"
        mode: "0600"
      notify: restart kart-pds

    - name: Deploy caddy.env
      template:
        src: ../templates/kart-pds/caddy.env.j2
        dest: "{{ kart_pds_data_dir }}/caddy.env"
        mode: "0600"
      notify: restart kart-pds

    - name: Deploy kart-pds.service
      template:
        src: ../templates/kart-pds/kart-pds.service.j2
        dest: /etc/systemd/system/kart-pds.service
        mode: "0644"
      notify:
        - reload systemd
        - restart kart-pds

    - name: Record tranquil-pds image ID before pull
      ansible.builtin.command: >-
        docker image inspect --format '{% raw %}{{ .Id }}{% endraw %}' {{ kart_pds_image }}
      register: kart_pds_image_before
      changed_when: false
      failed_when: false

    - name: Pull tranquil-pds image
      ansible.builtin.command: >-
        docker compose -f {{ kart_pds_data_dir }}/docker-compose.yml pull tranquil-pds
      changed_when: false

    - name: Record tranquil-pds image ID after pull
      ansible.builtin.command: >-
        docker image inspect --format '{% raw %}{{ .Id }}{% endraw %}' {{ kart_pds_image }}
      register: kart_pds_image_after
      changed_when: kart_pds_image_after.stdout != kart_pds_image_before.stdout
      notify: restart kart-pds

    - name: Validate Tranquil PDS config
      ansible.builtin.command: >-
        docker compose -f {{ kart_pds_data_dir }}/docker-compose.yml
        run --rm --no-deps tranquil-pds
        validate --ignore-secrets
      changed_when: false

    - name: Enable kart-pds service
      systemd:
        name: kart-pds
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart kart-pds
      systemd:
        name: kart-pds
        state: restarted
