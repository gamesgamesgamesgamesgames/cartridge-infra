name: Build tranquil-pds image

on:
  # Hourly poll for new upstream release tags. Runs are a no-op unless a tag
  # appears that we haven't built yet.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "Tranquil version to build (e.g. 0.6.7). Defaults to the latest upstream release."
        required: false
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tranquil-pds.yml'

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-tranquil-pds
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://tangled.org/tranquil.farm/tranquil-pds.git
  IMAGE: ghcr.io/gamesgamesgamesgamesgames/tranquil-pds

jobs:
  build:
    name: Build and publish tranquil-pds
    runs-on: depot-ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          LATEST=$(git ls-remote --tags --refs "$UPSTREAM_REPO" \
            | awk '{print $2}' \
            | sed 's#^refs/tags/v##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "::error::Could not determine latest upstream release tag"
            exit 1
          fi
          VER="${VERSION_INPUT#v}"
          VER="${VER:-$LATEST}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # Only move :latest (and deploy) when building the newest release,
          # so a manual rebuild of an older version can't downgrade kart-pds.
          if [ "$VER" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Latest upstream release: $LATEST; building: $VER"

      - name: Check for existing image
        id: check
        env:
          VER: ${{ steps.ver.outputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && docker buildx imagetools inspect "$IMAGE:$VER" >/dev/null 2>&1; then
            echo "$IMAGE:$VER already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.UPSTREAM_REPO }}#v${{ steps.ver.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.is_latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=tranquil-pds
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://tangled.org/tranquil.farm/tranquil-pds

      - name: Trigger kart-pds deploy
        if: steps.check.outputs.build == 'true' && steps.ver.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ steps.ver.outputs.version }}
        run: gh workflow run deploy-kart-pds.yml --ref main -f tranquil_version="$VER"
