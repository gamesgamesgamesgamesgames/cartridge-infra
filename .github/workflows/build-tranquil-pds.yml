name: Build tranquil-pds image

on:
  # Hourly poll for new commits on upstream main. Runs are a no-op unless
  # main has moved to a commit we haven't built yet.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream git ref to build (branch, tag, or full commit SHA). Defaults to main."
        required: false
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tranquil-pds.yml'

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-tranquil-pds
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://tangled.org/tranquil.farm/tranquil-pds.git
  IMAGE: ghcr.io/gamesgamesgamesgamesgames/tranquil-pds

jobs:
  build:
    name: Build and publish tranquil-pds
    runs-on: depot-ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit
        id: ver
        env:
          REF_INPUT: ${{ github.event.inputs.ref }}
        run: |
          MAIN_SHA=$(git ls-remote "$UPSTREAM_REPO" refs/heads/main | awk '{print $1}')
          if [ -z "$MAIN_SHA" ]; then
            echo "::error::Could not resolve upstream main"
            exit 1
          fi
          REF="${REF_INPUT:-main}"
          if echo "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            SHA="$REF"
          else
            # Peeled tag (^{}) sorts after the tag object, so tail picks the commit.
            SHA=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$REF" "refs/tags/$REF" "refs/tags/$REF^{}" \
              | tail -n1 | awk '{print $1}')
          fi
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve upstream ref '$REF'"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Only move :main (and deploy) when building upstream main's head,
          # so a manual build of another ref can't replace what kart-pds runs.
          if [ "$SHA" = "$MAIN_SHA" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Upstream main: $MAIN_SHA; building $REF at $SHA"

      - name: Check for existing image
        id: check
        env:
          SHA: ${{ steps.ver.outputs.sha }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && docker buildx imagetools inspect "$IMAGE:$SHA" >/dev/null 2>&1; then
            echo "$IMAGE:$SHA already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.UPSTREAM_REPO }}#${{ steps.ver.outputs.sha }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.sha }}
            ${{ steps.ver.outputs.is_main == 'true' && format('{0}:main', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=tranquil-pds
            org.opencontainers.image.revision=${{ steps.ver.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://tangled.org/tranquil.farm/tranquil-pds

      - name: Trigger kart-pds deploy
        if: steps.check.outputs.build == 'true' && steps.ver.outputs.is_main == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: gh workflow run deploy-kart-pds.yml --ref main -f tranquil_version="$SHA"
